<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>CANDYPOCALYPSE — Slice 2</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* A class that sets `display` beats the browser's own [hidden] rule, so
         anything toggled with el.hidden needs this or it never goes away. */
      [hidden] { display: none !important; }
      html, body, #app { width: 100%; height: 100%; overflow: hidden; background: #0b0716; }
      body { font: 13px/1.3 ui-monospace, "SF Mono", Menlo, monospace; color: #fff; }
      canvas { display: block; }

      .hud { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

      .hud-panel {
        position: absolute;
        display: flex; align-items: center; gap: 8px;
        padding: 6px 12px 6px 8px;
        background: rgba(10, 6, 22, 0.62);
        border-left: 3px solid var(--accent);
        border-radius: 3px;
        backdrop-filter: blur(6px);
        transition: opacity 120ms linear;
      }
      .hud-panel .tag { color: var(--accent); font-weight: 700; letter-spacing: .08em; }
      .hud-panel .src { opacity: .5; font-size: 11px; }

      .hud-divider {
        position: absolute;
        background: linear-gradient(90deg, #ff7a29, #9d5cff);
        box-shadow: 0 0 14px rgba(157, 92, 255, .8);
      }

      .hud-leash {
        position: absolute; transform: translateX(-50%);
        padding: 5px 12px; border-radius: 3px;
        background: rgba(255, 60, 60, .18);
        border: 1px solid rgba(255, 90, 90, .6);
        color: #ffb9b9; font-size: 11px; letter-spacing: .06em;
        transition: opacity 180ms linear;
      }

      .hud-panel .candy { color: #ffd9a8; font-weight: 700; }

      /* Contextual prompt, inside the player's own pane. */
      .hud-prompt {
        position: absolute; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        font-size: 11px; letter-spacing: .1em; color: #fff;
        text-shadow: 0 1px 6px rgba(0,0,0,.9);
        transition: opacity 120ms linear;
      }
      .hud-prompt .bar {
        width: 132px; height: 4px; border-radius: 2px;
        background: rgba(255,255,255,.16); overflow: hidden;
        transition: opacity 120ms linear;
      }
      .hud-prompt .bar i { display: block; height: 100%; background: var(--accent); }

      /* Shared, because the homeowner is the one thing both players share. */
      .hud-watch {
        position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 12px;
        padding: 7px 16px; border-radius: 20px;
        background: rgba(10, 6, 22, .74); backdrop-filter: blur(6px);
        border: 1px solid rgba(255,255,255,.07);
        font-size: 11px; letter-spacing: .08em; white-space: nowrap;
        transition: border-color 160ms linear;
      }
      .hud-watch.is-alarmed { border-color: rgba(255, 90, 90, .8); }
      .hud-watch .state { font-weight: 700; color: #ffd9a8; }
      .hud-watch.is-alarmed .state { color: #ff8f8f; }
      .hud-watch .meter {
        width: 74px; height: 4px; border-radius: 2px;
        background: rgba(255,255,255,.14); overflow: hidden;
      }
      .hud-watch .meter i {
        display: block; height: 100%;
        background: linear-gradient(90deg, #ffd9a8, #ff5a5a);
      }
      .hud-watch .dim { opacity: .5; }
      /* A zsák a vezetés sávjában is: ugyanaz a szám, mint a házban. */
      .hud-watch .candy { font-weight: 700; color: #ffd9a8; }
      /* A kinti kihívás: amíg nincs kész, a parkoló zárva. */
      .hud-watch .task { font-weight: 700; color: #7ad7ff; letter-spacing: .06em; }
      /* A város haragja: nyugodtan halvány, dühösen vörös. */
      .hud-watch .anger { letter-spacing: .08em; color: #9a9aa8; }
      .hud-watch .anger[data-hot="true"] { color: #ff8f8f; font-weight: 700; }
      .hud-watch .done { color: #7ef0b6; font-weight: 700; }
      .hud-watch .exit { color: #7ad7ff; font-weight: 700; }

      /* --- Driving section ------------------------------------------- */
      .hud-panel .role { font-size: 10px; letter-spacing: .14em; opacity: .8; }

      .house-map { z-index: 4; pointer-events: none; position: fixed; border: 1px solid rgba(255,255,255,.12); border-radius: 5px; box-shadow: 0 8px 28px rgba(0,0,0,.55); }
      .nav-map {
        position: fixed; z-index: 2;
        border-top: 0;
      }

      .drive-speed {
        position: absolute; right: 20px;
        display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap;
        justify-content: flex-end; width: 150px;
        text-shadow: 0 2px 10px rgba(0,0,0,.9);
      }
      .drive-speed b {
        font-size: 40px; line-height: .9; color: #fff;
        font-variant-numeric: tabular-nums;
      }
      .drive-speed span { font-size: 11px; opacity: .55; letter-spacing: .1em; }
      /* Track and fill are separate elements: a flex child cannot be sized by
         width once flex-basis claims the row. */
      .drive-speed u {
        display: block; flex-basis: 100%; margin-top: 7px;
        height: 3px; border-radius: 2px; overflow: hidden;
        background: rgba(255,255,255,.14);
      }
      .drive-speed i {
        display: block; height: 100%; width: 0;
        background: linear-gradient(90deg, #ff7a29, #ffd9a8);
      }

      /* A bearing the navigator throws over; it expires on purpose. */
      .drive-ping {
        position: absolute; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        transition: opacity 140ms linear;
      }
      .drive-ping .arrow {
        font-size: 62px; line-height: 1; color: #ffd9a8;
        filter: drop-shadow(0 0 14px rgba(255,170,60,.75));
      }
      .drive-ping .cap {
        font-size: 10px; letter-spacing: .22em; color: #ffd9a8; opacity: .8;
      }

      .drive-verbs {
        position: absolute; right: 20px;
        display: flex; gap: 7px; z-index: 3;
      }
      .drive-verbs span {
        display: inline-flex; align-items: center;
        padding: 4px 10px; border-radius: 3px; font-size: 10px; letter-spacing: .12em;
        background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
        color: rgba(255,255,255,.62);
      }
      .drive-verbs span.hot {
        background: rgba(110,240,192,.18); border-color: rgba(110,240,192,.6); color: #6ef0c0;
      }

      /* Permanent, quiet control legend inside each player's own pane. */
      .hud-legend {
        position: absolute; max-width: 44%;
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        font-size: 9.5px; letter-spacing: .06em; color: rgba(255,255,255,.5);
        text-shadow: 0 1px 4px rgba(0,0,0,.9);
        transition: opacity 140ms linear;
      }
      .hud-legend kbd, .drive-verbs kbd, .hud-prompt kbd {
        font: inherit; font-weight: 700; color: var(--accent, #ffd9a8);
        padding: 1px 5px; margin-right: 5px; border-radius: 2px;
        background: rgba(255,255,255,.1);
        border: 1px solid rgba(255,255,255,.16);
      }
      .drive-verbs kbd { --accent: #ffd9a8; margin-right: 4px; }
      .hud-prompt kbd { --accent: inherit; font-size: 10px; }

      .hud-banner {
        /* A BILLENTYŰ-MAGYARÁZÓ FÖLÉ. A magyarázó alul 46 képponttal kezdődik
           és tördelve két sor is lehet; 52 képpont nem volt elég fölé, és
           880×620-on mérve egymásra futottak. */
        position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
        padding: 7px 18px; border-radius: 3px;
        background: rgba(10, 6, 22, .8); backdrop-filter: blur(6px);
        border-left: 3px solid #ff7a29;
        font-size: 12px; letter-spacing: .06em; white-space: nowrap;
        transition: opacity 200ms linear;
      }
      /* An instruction the players have to act on, not a line of news: bigger,
         brighter, and it pulses until somebody does something about it. */
      .hud-banner.is-prompt {
        border-left-color: #7ad7ff; font-size: 14px; padding: 10px 22px;
        background: rgba(12, 20, 38, .9);
        animation: prompt-pulse 1.4s ease-in-out infinite;
      }
      @keyframes prompt-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(122, 215, 255, .0); }
        50%      { box-shadow: 0 0 18px 2px rgba(122, 215, 255, .35); }
      }

      /* A társ iránya a válaszvonalon: osztott képen ez köti össze a két
         világot, különben csak két külön kép van egymás mellett. */
      .hud-partner {
        position: absolute; width: 28px; height: 28px;
        display: grid; place-items: center;
        font-size: 18px; line-height: 1;
        color: var(--accent, #ff7a29);
        text-shadow: 0 0 10px rgba(0, 0, 0, .9);
        transition: opacity 160ms linear;
        pointer-events: none;
      }

      /* --- Loading + results ------------------------------------------- */
      .loading {
        position: fixed; inset: 0; z-index: 35;
        display: grid; place-items: center;
        background: #0b0716; color: rgba(255,255,255,.5);
        font-size: 11px; letter-spacing: .28em;
      }

      .results { justify-content: flex-start; gap: 14px; }
      .candy-total {
        display: flex; align-items: baseline; gap: 10px;
        padding: 14px 26px; border-radius: 6px;
        background: rgba(255,122,41,.1); border: 1px solid rgba(255,122,41,.28);
      }
      .candy-total span { font-size: 22px; }
      .candy-total b {
        font-size: 40px; color: #ffd9a8; font-variant-numeric: tabular-nums; line-height: 1;
      }
      .candy-total em { font-style: normal; font-size: 11px; opacity: .5; letter-spacing: .1em; }

      /* Wide column gaps: label/value pairs sitting side by side merge into
         one run of words without them. */
      .stats {
        display: grid; gap: 9px 40px; width: 100%; max-width: 620px;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      }
      .stats div {
        display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
        padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,.07);
      }
      .stats dt { font-size: 10.5px; letter-spacing: .1em; opacity: .45; }
      .stats dd { font-size: 14px; color: #fff; font-variant-numeric: tabular-nums; }

      .awards {
        display: grid; gap: 10px; width: 100%; max-width: 900px;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      }
      .awards article {
        display: grid; gap: 4px; text-align: left;
        padding: 13px 15px; border-radius: 5px;
        background: rgba(255,255,255,.035);
        border: 1px solid rgba(255,255,255,.07);
        border-top: 3px solid #9d5cff;
      }
      .awards h3 { font-size: 10px; letter-spacing: .16em; color: #9d5cff; }
      .awards .who { font-size: 15px; font-weight: 700; color: #ffd9a8; }
      .awards p { font-size: 11px; line-height: 1.55; opacity: .55; }

      .choices { display: flex; gap: 10px; margin-top: 4px; }
      .choices span {
        padding: 11px 22px; border-radius: 4px; font-size: 11.5px; letter-spacing: .14em;
        background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
        color: rgba(255,255,255,.55);
        transition: background 130ms linear, color 130ms linear, border-color 130ms linear;
      }
      .choices span.is-active {
        background: linear-gradient(92deg, #ff7a29, #9d5cff); color: #0b0716;
        border-color: transparent; font-weight: 700;
      }

      /* --- Pause & settings -------------------------------------------- */
      .pause {
        position: fixed; inset: 0; z-index: 40;
        display: grid; place-items: center; padding: 24px;
        background: rgba(7, 4, 15, .78); backdrop-filter: blur(3px);
      }
      .pause-card {
        width: min(560px, 100%); max-height: 100%; overflow: auto;
        display: grid; gap: 12px;
        padding: 22px 24px; border-radius: 6px;
        background: rgba(18, 12, 34, .96);
        border: 1px solid rgba(255,255,255,.08);
        box-shadow: 0 24px 70px rgba(0,0,0,.6);
      }
      .pause-card h2 {
        font-size: 15px; letter-spacing: .22em; color: #ffd9a8;
      }
      .pause-card .hint { font-size: 10.5px; opacity: .45; line-height: 1.7; }
      .pause-card .hint b { color: #ffd9a8; }
      .pause-card ul { list-style: none; display: grid; gap: 1px; }
      .pause-card li {
        display: grid; grid-template-columns: 1fr auto; align-items: baseline;
        gap: 4px 12px; padding: 9px 12px; border-radius: 4px;
        border-left: 3px solid transparent;
        transition: background 120ms linear, border-color 120ms linear;
      }
      .pause-card li.is-active {
        background: rgba(255,255,255,.07); border-left-color: #ff7a29;
      }
      .pause-card .label { font-size: 12px; letter-spacing: .1em; }
      .pause-card .value {
        font-size: 11.5px; letter-spacing: .08em; color: #ffd9a8;
        font-variant-numeric: tabular-nums;
      }
      .pause-card li.is-action .label { color: #9d5cff; }
      .pause-card li.is-action.is-active .label { color: #c99bff; }
      .pause-card li.is-action .value { color: rgba(255,255,255,.3); }
      .pause-card .note {
        grid-column: 1 / -1; font-size: 10px; opacity: .38; line-height: 1.5;
      }

      .fps {
        position: fixed; right: 12px; bottom: 12px; z-index: 6;
        padding: 3px 8px; border-radius: 3px;
        background: rgba(10,6,22,.72); color: #7ef0b6;
        font-size: 10px; letter-spacing: .1em; font-variant-numeric: tabular-nums;
        pointer-events: none;
      }

      /* --- Title screen ------------------------------------------------ */
      .select[data-phase="menu"] { justify-content: center; }
      .keyart {
        position: absolute; inset: 0; z-index: -1;
        background: url('art/keyart.webp') center/cover no-repeat;
      }
      /* The art is busy and the type has to sit on it, so the scrim is a
         gradient rather than a flat wash: the characters stay readable at the
         top while the copy gets a solid ground at the bottom. */
      .keyart::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(180deg,
          rgba(11,7,22,.35) 0%,
          rgba(11,7,22,.55) 45%,
          rgba(11,7,22,.9) 100%);
      }
      /* The menu sits over busy art, so it carries its own ground. A scrim
         alone cannot be tuned to work over both the moonlit sky and the jeep. */
      .title-inner {
        display: grid; gap: 12px; justify-items: center;
        width: min(560px, 100%); padding: 30px 34px; border-radius: 8px;
        background: rgba(9, 6, 19, .82);
        border: 1px solid rgba(255,255,255,.07);
        box-shadow: 0 30px 80px rgba(0,0,0,.55);
        backdrop-filter: blur(6px);
      }
      .title-inner .kicker {
        font-size: 10px; letter-spacing: .34em; opacity: .55;
      }
      .logo {
        font-size: clamp(30px, 7vw, 66px); font-weight: 700; letter-spacing: -.015em;
        line-height: .95;
        background: linear-gradient(92deg, #ff9a45, #ffd9a8 40%, #b97cff);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 4px 18px rgba(0,0,0,.7));
      }
      .tagline { font-size: 13px; opacity: .72; letter-spacing: .02em; }

      .menu { display: grid; gap: 7px; width: min(340px, 100%); margin: 6px 0 2px; }
      .menu-item {
        position: relative; overflow: hidden;
        display: grid; grid-template-columns: 34px 1fr 14px; align-items: center;
        gap: 12px; width: 100%; padding: 11px 14px;
        text-align: left; cursor: pointer; font: inherit; color: #fff;
        background: linear-gradient(90deg, #ffffff12, #ffffff07);
        border: 1px solid #ffffff14; border-radius: 6px;
        transition: background .14s linear, border-color .14s linear,
                    transform .14s ease, box-shadow .14s linear;
      }
      /* A bal szélen egy csík, ami a KIVÁLASZTOTT soron kinő. Egy sor,
         aminek csak a háttere változik, ugyanolyan súlyú marad; a csík
         irányt ad — megmondja, hol tartasz a listában. */
      .menu-item::before {
        content: ""; position: absolute; left: 0; top: 50%;
        width: 3px; height: 0; border-radius: 0 3px 3px 0;
        background: linear-gradient(#ff9a45, #9d5cff);
        transform: translateY(-50%); transition: height .16s ease;
      }
      .menu-item .mark { font-size: 17px; line-height: 1; text-align: center;
        filter: grayscale(.55) opacity(.7);
        transition: filter .14s linear, transform .14s ease; }
      .menu-item .text { display: grid; gap: 2px; min-width: 0; }
      .menu-item .label { font-size: 13px; font-weight: 700; letter-spacing: .14em; }
      .menu-item .detail { font-size: 10.5px; letter-spacing: .04em; opacity: .5; }
      .menu-item .go { opacity: 0; color: #ffb347; font-size: 12px;
        transform: translateX(-4px);
        transition: opacity .14s linear, transform .14s ease; }
      .menu-item.is-active {
        background: linear-gradient(90deg, #ff7a2933, #9d5cff1f 60%, #ffffff05);
        border-color: #ff7a2966; transform: translateX(3px);
        box-shadow: 0 6px 22px #00000059;
      }
      .menu-item.is-active::before { height: 70%; }
      .menu-item.is-active .mark { filter: none; transform: scale(1.12); }
      .menu-item.is-active .go { opacity: 1; transform: translateX(0); }
      @media (prefers-reduced-motion: reduce) {
        .menu-item, .menu-item::before, .menu-item .mark, .menu-item .go { transition: none; }
      }
      .menu-item:focus-visible { outline: 2px solid #ffd9a8; outline-offset: 2px; }

      /* Clickable confirm for the screens a mouse user would otherwise be
         stuck on: every menu here is driven by gamepad first, but a person at
         a laptop expects a button. */
      .go {
        cursor: pointer; font: 600 12px/1 ui-monospace, Menlo, monospace;
        letter-spacing: .16em; padding: 12px 30px; border-radius: 4px;
        color: #0b0716; border: 0;
        background: linear-gradient(92deg, #ff7a29, #9d5cff);
      }
      .go:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

      .select .card, .select .role, .choices span { cursor: pointer; }
      /* --- A menü billentyűzete -------------------------------------------
         A gombok kirajzolva, nem felsorolva: egy betűsor nem mutatja meg,
         HOL van a gomb. A színek a szerepet mondják el, a jelmagyarázat
         pedig megnevezi őket — így a kép és a szöveg ugyanazt állítja. */
      .kb { display: grid; grid-template-columns: auto auto; justify-content: center;
            align-items: end; gap: 18px; margin-top: 10px; }
      .kb-keys, .kb-arrows { display: grid; gap: 5px; justify-items: center; }
      .kb-row { display: flex; gap: 5px; }
      .kb kbd { font: 600 11px/1 ui-monospace, Menlo, monospace; color: #ffffff6b;
                background: #ffffff0f; border: 1px solid #ffffff1a;
                border-bottom-width: 2px; border-radius: 5px;
                min-width: 26px; height: 26px; padding: 0 7px;
                display: inline-flex; align-items: center; justify-content: center;
                transition: transform .12s ease; }
      .kb kbd.wide { min-width: 62px; letter-spacing: .06em; }
      /* A kiemelt gombok: telítettebb szín, világosabb betű, és egy hajszállal
         megemelve — attól néznek ki lenyomhatónak. */
      .kb kbd.move  { color: #ffd9a8; background: #ff7a2933; border-color: #ff7a2980; }
      .kb kbd.jump  { color: #bff3ff; background: #7ad7ff2b; border-color: #7ad7ff73; }
      .kb kbd.drift { color: #ffc9a1; background: #ff9d4a26; border-color: #ff9d4a66; }
      .kb kbd.boost { color: #d7c4ff; background: #9d5cff2e; border-color: #9d5cff80; }
      .kb kbd.use   { color: #9ff0c8; background: #6ef0c026; border-color: #6ef0c066; }
      .kb kbd.look  { color: #cfd6ff; background: #9fb6ff1f; border-color: #9fb6ff4d; }
      .kb kbd.chat  { color: #9ff0ff; background: #4fd6e626; border-color: #4fd6e666; }
      .kb kbd.move, .kb kbd.jump, .kb kbd.drift,
      .kb kbd.boost, .kb kbd.use, .kb kbd.look, .kb kbd.msg { transform: translateY(-1px); }
      .kb-legend { grid-column: 1 / -1; display: flex; flex-wrap: wrap;
                   justify-content: center; gap: 4px 14px; margin-top: 4px;
                   list-style: none; font-size: 10px; letter-spacing: .08em;
                   color: #ffffff5c; }
      .kb-legend li { display: flex; align-items: center; gap: 5px; }
      .kb-legend i { width: 8px; height: 8px; border-radius: 2px; display: block; }
      .kb-legend i.move { background: #ff7a29; }
      .kb-legend i.jump { background: #7ad7ff; }
      .kb-legend i.drift { background: #ff9d4a; }
      .kb-legend i.boost { background: #9d5cff; }
      .kb-legend i.use { background: #6ef0c0; }
      .kb-legend i.look { background: #9fb6ff; }
      .kb-legend i.msg { background: #4fd6e6; }
      @media (width <= 560px) { .kb { grid-template-columns: auto; gap: 10px; } }
      .schemes {
        display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 4px;
      }
      .schemes div {
        display: grid; gap: 3px; padding: 8px 14px; border-radius: 4px;
        background: rgba(255,255,255,.05); border-left: 3px solid var(--c);
      }
      .schemes b { font-size: 9.5px; letter-spacing: .16em; color: var(--c); }
      .schemes span { font-size: 11px; opacity: .6; }
      .prompt {
        margin-top: 6px; font-size: 12px; letter-spacing: .18em; color: #ffd9a8;
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: .45 } 50% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .prompt { animation: none; opacity: .9 } }

      /* --- Name entry --------------------------------------------------- */
      .names { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
      .name {
        display: grid; gap: 9px; justify-items: center;
        padding: 16px 20px; border-radius: 5px;
        background: rgba(255,255,255,.035);
        border: 1px solid rgba(255,255,255,.07);
        border-top: 3px solid var(--c);
        transition: background 140ms linear;
      }
      .name.is-locked { background: rgba(255,255,255,.1); }
      .name .tag { font-size: 9.5px; letter-spacing: .16em; color: var(--c); }
      .name-field {
        width: 230px; max-width: 100%;
        font: 700 18px/1 ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: .06em; text-align: center; color: #fff;
        padding: 10px 12px; border-radius: 4px;
        background: rgba(255,255,255,.06);
        border: 1px solid rgba(255,255,255,.12);
        border-bottom: 2px solid rgba(255,255,255,.18);
        outline: none;
        transition: border-color 140ms linear, background 140ms linear;
      }
      .name-field::placeholder { color: rgba(255,255,255,.22); font-weight: 400; }
      .name-field:focus {
        background: rgba(255,255,255,.12);
        border-color: var(--c); border-bottom-color: var(--c);
      }
      .name.is-typing .tag { opacity: 1; }
      .name .tag { cursor: pointer; }
      .name .state { font-size: 9.5px; letter-spacing: .14em; opacity: .4; }

      /* --- Brief -------------------------------------------------------- */
      .brief {
        list-style: none; counter-reset: step; display: grid; gap: 10px;
        text-align: left; max-width: 52ch; font-size: 12.5px;
      }
      .brief li {
        counter-increment: step; padding-left: 30px; position: relative;
        line-height: 1.65; opacity: .74;
      }
      .brief li::before {
        content: counter(step); position: absolute; left: 0; top: 1px;
        width: 19px; height: 19px; border-radius: 50%;
        display: grid; place-items: center; font-size: 10px; font-weight: 700;
        background: rgba(255,122,41,.18); color: #ff7a29;
      }
      .brief b { color: #ffd9a8; opacity: 1; }

      /* Drift: a sebessegmero maga valaszol, nem egy uj kijelzo. */
      .drive-speed em {
        position: absolute; right: 0; top: -15px;
        font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .18em;
        color: #ffb347; text-shadow: 0 0 10px rgba(255,138,42,.7);
      }
      .drive-speed.is-drifting b { color: #ffb347; }

      /* --- Intro: sotet kepernyo, betunkent kiirodo szoveg ------------- */
      .intro {
        position: fixed; inset: 0; z-index: 40;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 26px; padding: 40px 28px; text-align: center;
        background: #05030a;
        transition: opacity .6s ease;
      }
      .intro.is-out { opacity: 0; pointer-events: none; }
      .intro-body {
        display: flex; flex-direction: column; gap: 6px;
        max-width: 720px; min-height: 260px; justify-content: center;
      }
      .intro-body p {
        margin: 0; min-height: 1.35em;
        font-size: clamp(17px, 2.5vw, 27px); font-weight: 600; letter-spacing: .03em;
        color: #e8dcc8; text-shadow: 0 0 24px rgba(255,138,42,.22);
      }
      .intro-body p.shout {
        color: #ffb347; font-size: clamp(20px, 3vw, 32px); font-weight: 800;
        text-shadow: 0 0 30px rgba(255,138,42,.5);
      }
      .intro-body p.warn { color: #b79bff; }
      .intro-skip {
        font-size: 11px; letter-spacing: .16em; color: rgba(255,255,255,.3);
        animation: introblink 2.4s ease-in-out infinite;
      }
      @keyframes introblink { 0%,100% { opacity: .25; } 50% { opacity: .65; } }

      /* --- Kapcsolatjelzo --------------------------------------------- */
      /* Mindig a jobb felso sarokban, a menu fole is: a parositas ott dol el. */
            /* --- A két játékos beszélgetése ------------------------------------
         Bal alul, a vezetés igéi fölött. A sorok maguktól eltűnnek: egy
         beszélgetés, ami felhalmozódik a képernyőn, előbb-utóbb a játékot
         takarja el. */
      /* A BESZÉLGETŐ PANEL. A neve nem lehet `chat` a billentyű-ábrában is:
         ott öt `<kbd class="chat">` van, és erre a szabályra mind az öt
         RÁRAGADT — `position: fixed`-del a képernyő aljára szögezve, egymáson,
         198 képpont szélesen. A menüben ez egy nagy türkiz folt volt a
         magyarázó fölött, és semmi nem árulta el, honnan jön. A billentyűk
         azóta `msg` osztályt viselnek. */
      .chat { position: fixed; left: 14px; bottom: 84px; z-index: 6;
              width: min(320px, 38vw); display: grid; gap: 6px; }
      .chat-log { display: grid; gap: 3px; }
      .chat-log p { margin: 0; padding: 5px 9px; border-radius: 4px;
                    font-size: 11.5px; line-height: 1.45;
                    background: rgba(10, 6, 22, .74);
                    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
                    border-left: 3px solid #9d5cff; color: #fff;
                    animation: chat-in .16s ease-out; }
      .chat-log p.mine { border-left-color: #ff7a29; }
      .chat-log b { color: #9d5cff; letter-spacing: .08em; font-size: 9.5px;
                    display: block; }
      .chat-log p.mine b { color: #ff7a29; }
      @keyframes chat-in { from { opacity: 0; transform: translateY(4px); } }
      .chat-field { font: inherit; font-size: 12px; color: #fff;
                    background: rgba(10, 6, 22, .9); border: 1px solid #ff7a2980;
                    border-radius: 4px; padding: 7px 10px; outline: none;
                    pointer-events: auto; }
      .chat-field::placeholder { color: rgba(255,255,255,.35); }
      @media (prefers-reduced-motion: reduce) { .chat-log p { animation: none; } }
/* AZ ELIGAZÍTÁS. Sötét lap, egyetlen fénykörrel — ugyanaz a kép, mint
   amiben a játék van. */
.haunt-brief {
  position: fixed; inset: 0; z-index: 900;
  display: grid; align-content: center; justify-items: center; gap: 18px;
  padding: 6vh 6vw;
  background:
    radial-gradient(40rem 26rem at 50% 42%, #1a1226 0%, #07050b 72%),
    #07050b;
  color: #cdbfdd;
  font: 400 14px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
  text-align: center;
}
.haunt-brief h2 {
  margin: 0; font-size: clamp(26px, 5vw, 42px); letter-spacing: .12em;
  color: #fff; font-weight: 700;
}
.haunt-brief .mit { margin: 0; max-width: 46rem; color: #a897bd; }
.haunt-brief .sorok {
  display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
  max-width: 62rem; width: 100%; text-align: left;
}
.haunt-brief .szorny {
  border: 1px solid #2c2140; border-radius: 4px; padding: 12px 13px;
  background: #0e0a16; display: grid; gap: 5px;
}
.haunt-brief .szorny b { color: #fff; letter-spacing: .1em; font-size: 15px; }
.haunt-brief .jel { color: #7f6f96; font-size: 11.5px; letter-spacing: .06em; }
.haunt-brief .ellen { color: #ffbe6a; font-size: 12.5px; }
.haunt-brief .eszkoz {
  display: grid; gap: 8px; max-width: 46rem; text-align: left;
  color: #9d8fb4; font-size: 12.5px;
}
.haunt-brief .eszkoz b { color: #e6dcf2; }
.haunt-brief .tovabb { margin: 4px 0 0; color: #6b5d80; font-size: 11.5px; letter-spacing: .14em; }

/* A KÍSÉRTETHÁZ KIJELZŐJE. Halvány és kicsi: horrorban a kijelző nem
   lehet kapaszkodó, csak a legkevesebb, ami még elég. */
.haunt-hud {
  position: fixed; left: 14px; bottom: 96px; z-index: 40;
  font: 600 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  letter-spacing: .06em; color: #cbb8d8; text-shadow: 0 1px 3px #000;
  pointer-events: none; display: grid; gap: 5px;
}
.haunt-hud .telep {
  position: relative; width: 190px; height: 15px;
  border: 1px solid #ffffff2e; border-radius: 3px; overflow: hidden;
  background: #0b0710cc;
}
.haunt-hud .telep i { position: absolute; inset: 0 auto 0 0; background: #ffbe6a; opacity: .55; }
.haunt-hud .telep[data-allapot="fele"] i { background: #ff9a3c; }
.haunt-hud .telep[data-allapot="keves"] i { background: #ff4d4d; animation: telep 1s steps(2) infinite; }
@keyframes telep { 50% { opacity: .18; } }
.haunt-hud .telep span { position: relative; display: block; text-align: center; font-size: 10px; line-height: 15px; color: #fff; }
.haunt-hud .baj { color: #ff6b6b; }

/* AZ IJESZTÉS. Teljes képernyő, másfél másodperc, semmi bevezetés.

   A rázkódás és a villanás nem díszítés: az arc magában egy kép, amit meg
   lehet nézni. Ami ijeszt, az a HIRTELENSÉG — ezért a legerősebb mozgás az
   első két képkockában van, és onnan csak halkul. */
.jumpscare {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #000 center/cover no-repeat;
  pointer-events: none;
}
.jumpscare.hit { animation: scare 1.2s steps(1, end) forwards, shake .55s linear; }
@keyframes scare {
  0%   { opacity: 1; filter: brightness(2.4) contrast(1.6) saturate(.4); }
  70%  { opacity: 1; filter: brightness(1) contrast(1.2); }
  100% { opacity: 0; }
}
@keyframes shake {
  0%, 100% { transform: scale(1.35) translate(0, 0); }
  12% { transform: scale(1.5) translate(-2.5%, 1.8%); }
  26% { transform: scale(1.42) translate(2.2%, -2.4%); }
  41% { transform: scale(1.48) translate(-1.8%, -1.2%); }
  58% { transform: scale(1.38) translate(1.4%, 1.6%); }
  76% { transform: scale(1.33) translate(-0.8%, -0.6%); }
}
/* Aki kikapcsolta a mozgást, annak nem rázkódik — de az arc marad. A
   horror nem lehet hozzáférhetetlen. */
@media (prefers-reduced-motion: reduce) {
  .jumpscare.hit { animation: scare 1.2s steps(1, end) forwards; }
}

.net-badge {
        /* BALRA, a névtábla alá. Jobb felül a MINIMAPA van — 880 képpont
           széles ablakban mérve a kettő egymásra futott, és a térkép a
           fontosabb: azt nézed menekülés közben, a szobajelzőt nem. */
        position: fixed; top: 46px; left: 14px; right: auto;
        max-width: min(420px, 52vw); z-index: 60; pointer-events: none;
        display: flex; align-items: center; gap: 8px;
        padding: 7px 12px 7px 10px; border-radius: 999px;
        background: rgba(11,7,22,.72); border: 1px solid rgba(255,255,255,.12);
        font-size: 11px; letter-spacing: .08em; color: rgba(255,255,255,.62);
        backdrop-filter: blur(6px);
      }
      .net-badge b { color: #fff; font-weight: 700; }
      .net-badge span { opacity: .72; letter-spacing: .04em; }
      .net-badge i {
        width: 8px; height: 8px; border-radius: 50%; background: #6b6b7a;
        box-shadow: 0 0 0 0 transparent;
      }
      .net-badge[data-state="wait"] i { background: #ffb545; animation: netpulse 1.4s infinite; }
      .net-badge[data-state="on"] i { background: #47e08a; }
      .net-badge[data-state="on"] { border-color: rgba(71,224,138,.35); }
      @keyframes netpulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255,181,69,.45); }
        50% { box-shadow: 0 0 0 6px rgba(255,181,69,0); }
      }

      /* --- Character & role select ------------------------------------ */
      .select {
        position: fixed; inset: 0; z-index: 30; overflow: auto;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; padding: 30px 24px; text-align: center;
        background: radial-gradient(120% 90% at 50% 0%, #1a1030 0%, #0b0716 70%);
      }
      .select h1 {
        font-size: clamp(20px, 3.4vw, 34px); font-weight: 700; letter-spacing: .06em;
        background: linear-gradient(92deg, #ff7a29, #9d5cff);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .select .hint { font-size: 11px; opacity: .5; line-height: 1.7; letter-spacing: .04em; }
      .select .hint b { color: #ffd9a8; }
      .select .foot { font-size: 11px; opacity: .38; letter-spacing: .05em; }

      /* Four characters, so four columns — auto-fit leaves one card stranded
         on its own row at common widths, which reads as a layout bug. */
      .select .grid {
        display: grid; gap: 12px; width: 100%; max-width: 1060px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      @media (max-width: 900px) {
        .select .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 480px) {
        .select .grid { grid-template-columns: minmax(0, 1fr); }
      }
      /* A portré a kártya főszereplője: a szörnyet ránézésre kell eldönteni,
         nem elolvasva. A számok ott maradnak, csak alárendelve. */

      /* ÉRINTŐVEZÉRLÉS. Csak telón jön létre (lásd hasTouch), tehát itt nem
         kell média-lekérdezés — az elem egyszerűen nincs ott gépen.
         `touch-action: none`: enélkül a böngésző a hüvelykujj mozdulatát
         görgetésnek hiszi, és a kormányzás közben elúszik az oldal. */
      .touch { position: fixed; inset: 0; pointer-events: none; z-index: 40; touch-action: none; }
      .touch[data-on="0"] { display: none; }
      .touch * { touch-action: none; -webkit-user-select: none; user-select: none; }

      .touch-pad {
        position: absolute; left: 22px; bottom: 26px; width: 132px; height: 132px;
        border-radius: 50%; pointer-events: auto;
        background: radial-gradient(circle, rgba(255,255,255,.10), rgba(255,255,255,.03) 70%);
        border: 1px solid rgba(255,255,255,.16);
      }
      .touch-knob {
        position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px;
        border-radius: 50%; background: rgba(255,170,60,.55);
        border: 1px solid rgba(255,210,150,.7); box-shadow: 0 0 18px rgba(255,140,40,.45);
      }

      /* A TŰZ a bal oldalon, a bot fölött. A jobb hüvelykujj a képet húzza
         (nézés), tehát a tűzgomb nem lehet ott: célozni és lőni egyszerre
         kell tudni. */
      .touch-fire {
        position: absolute; left: 20px; bottom: 176px;
        display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
        pointer-events: auto;
      }
      .touch-btn.fire {
        min-width: 96px; height: 70px; border-radius: 35px;
        color: #ffd9d0; background: rgba(255,80,50,.22); border-color: rgba(255,110,80,.5);
      }
      .touch-btn.fire[data-on] { background: rgba(255,90,60,.6); color: #fff; }
      .touch-btn.scope {
        min-width: 78px; height: 48px; font-size: 11px;
        color: #cfe6ff; border-color: rgba(159,182,255,.4);
      }
      .touch-btn.scope[data-on] { background: rgba(120,170,255,.45); color: #fff; }

      .touch-keys {
        position: absolute; right: 20px; bottom: 26px;
        display: flex; flex-direction: column-reverse; gap: 12px; align-items: flex-end;
        pointer-events: auto;
      }
      .touch-btn {
        min-width: 84px; height: 62px; padding: 0 16px; border-radius: 34px;
        font: 700 13px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em;
        color: #ffe9cf; background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.2);
      }
      .touch-btn[data-on] { background: rgba(255,150,50,.5); color: #fff; }
      .touch-btn.nitro { color: #bff3ff; border-color: rgba(120,230,255,.4); }
      .touch-btn.nitro[data-on] { background: rgba(70,200,255,.5); }

      .touch-top {
        position: absolute; right: 16px; top: 14px; display: flex; gap: 8px; pointer-events: auto;
      }
      .touch-mini {
        min-width: 54px; height: 34px; border-radius: 17px;
        font: 700 11px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .1em;
        color: #cfd6ff; background: rgba(12,8,24,.6); border: 1px solid rgba(255,255,255,.18);
      }


      /* MOBIL ELRENDEZÉS. A HUD gépre készült: 375 képpont széles képernyőn a
         sebességmérő a nitró gomb alatt volt, a billentyűnevek a kép alá
         lógtak, a pontsáv pedig 738 képpont széles egy 375-ösben.
         Nem külön HUD-ot építek, hanem AZT VESZEM KI, aminek érintőn nincs
         értelme, és a maradékot arrébb teszem a hüvelykujjak elől. */
      body[data-touch] .hud-legend,
      body[data-touch] .drive-verbs { display: none; }

      body[data-touch][data-playing] .net-badge { display: none; }

      /* A sebességmérő helyét a HUD kódja írja be inline stílusként (a
         navigátor panelhez igazítva), ezért itt CSAK `!important` tudja
         felülírni. Telón ez indokolt: a gépre szabott hely pont a nitró gomb
         alá esik, és a saját sebességedet nem takarhatja el a saját hüvelykujjad. */
      body[data-touch] .drive-speed {
        left: 12px !important; right: auto !important;
        top: auto !important; bottom: 176px !important;
        transform: scale(.78); transform-origin: 0 100%;
      }
      /* A kisterkép a navigátor képpaneljének a sarkában ül — azt nem mozgatom,
         mert akkor elválna attól, amit mutat. Helyette a GOMBOK mennek feljebb. */
      body[data-touch] .touch-keys { bottom: 150px; }
      /* A pontsáv FELÜLRE megy: alul a bal hüvelykujj és a botja ül rajta,
         és egy szám, amit a kezed takar, nem szám. */
      body[data-touch] .hud-watch {
        left: 8px; right: 8px; width: auto; max-width: none; transform: none;
        top: 46px; bottom: auto;
        font-size: 10px; gap: 8px; flex-wrap: wrap; justify-content: center;
      }
      /* Az üzenetsáv NE érjen a gombok alá: telón jobbról helyet hagyunk
         nekik, különben a szöveg a nitró gomb alatt folytatódik. */
      body[data-touch] .hud-banner {
        bottom: 250px; max-width: 220px; margin-right: 110px;
      }
      /* A fejlécben a beviteli eszköz neve („keyboard") telón se nem igaz,
         se nem fér ki — a CHAT gomb alá csúszott. */
      body[data-touch] .hud-panel { max-width: 200px; }
      body[data-touch] .chat { bottom: 200px; }


      /* ALACSONY KÉPERNYŐ (fekvő telefon) és ÉRINTŐ.
         Mérve 812×375-ön: a menü 501 képpont magas volt egy 375-ösben, tehát
         a CÍM csúszott ki a tetején — pont az, amiről a képernyő szól. A
         rajzolt billentyűzet 145 képpontot evett; érintőn ráadásul olyasmit
         mutat, ami ott nincs is. Ezért telón és alacsony képernyőn kimarad,
         és a helyére egy igaz mondat kerül. */
      body[data-touch] .kb { display: none; }
      @media (max-height: 560px) {
        .kb { display: none; }
        .title-inner { padding: 14px 20px; gap: 7px; }
        .title-inner .tagline { display: none; }
        .logo { font-size: clamp(22px, 5vw, 38px); }
        .menu-item { padding: 8px 12px; }
      }
      body[data-touch] .title-inner .foot::after {
        content: 'koppints a kártyára'; display: block; margin-top: 4px; opacity: .8;
      }


      /* CÉLKERESZT — csak belső nézetben, és csak ha van mivel célozni.
         Nem kör: a kör közepét a játékos nem látja, és pont az kell neki.
         Négy vonás hagy szabadon egy pontot, és a szélei mutatják a szórást. */
      /* ÉJJELLÁTÓ: zöldes derengés és vignetta. Nem csak jelzés — a kép
         SZÍNE mondja meg, hogy most látsz, és ez egy pillantás nélkül is
         érezhető. */
      .nightvision { position: fixed; inset: 0; pointer-events: none; z-index: 25;
        background: radial-gradient(120% 90% at 50% 50%,
          rgba(110,255,190,.10) 0%, rgba(20,60,40,.28) 70%, rgba(4,14,10,.5) 100%);
        mix-blend-mode: screen; }
      .nightvision[hidden] { display: none; }

      .crosshair { position: fixed; left: 50%; top: 50%; width: 26px; height: 26px;
        margin: -13px 0 0 -13px; pointer-events: none; z-index: 30; opacity: .85; }
      .crosshair i { position: absolute; background: rgba(255,255,255,.9);
        box-shadow: 0 0 4px rgba(0,0,0,.8); }
      .crosshair i:nth-child(1) { left: 12px; top: 0; width: 2px; height: 8px; }
      .crosshair i:nth-child(2) { left: 12px; bottom: 0; width: 2px; height: 8px; }
      .crosshair i:nth-child(3) { top: 12px; left: 0; height: 2px; width: 8px; }
      .crosshair i:nth-child(4) { top: 12px; right: 0; height: 2px; width: 8px; }
      /* Amíg nem pontos (mesterlövész futás közben), tágabb és halványabb. */
      .crosshair[data-steady="0"] { transform: scale(1.9); opacity: .4; }
      .crosshair[hidden] { display: none; }


      /* FOGÓ MÓD kijelzője. Bal alul a saját állásod, jobb alul az ellenfélé —
         a kettő nem keveredhet, mert egy pillantásra kell eldönteni, sietni
         kell-e. */
      /* A ház alján szabad a hely; a VÁROSBAN viszont ott fut a pontsáv, a
         billentyű-magyarázó és a sebességmérő — mérve mind a három ütközött
         vele. Kint ezért FELÜLRE megy, a névtábla alá. */
      /* A FOGÓ KIJELZŐJE A BAL OLDALI OSZLOPBAN.
         Előbb a képernyő aljára tettem, aztán a felső sávba — mindkettőnél
         ütközött valamivel (pontsáv, magyarázó, névtábla, szobajelző,
         minimapa), méghozzá csak KESKENYEBB ablakban, ahol a blokkok
         összeérnek. A bal oszlop az egyetlen sáv, amit semmi más nem
         használ: a névtábla alatt kezdődik, és a magyarázó fölött véget ér. */
      .fogo { position: fixed; left: 16px; top: 132px; bottom: auto; right: auto;
        display: grid; gap: 10px; justify-items: start; pointer-events: none;
        z-index: 28; font-family: ui-monospace, Menlo, monospace; }
      .fogo-me, .fogo-them { grid-auto-flow: column; }
      /* A HÁZBAN is felülre megy: a kép alján a pontsáv és a
         billentyű-magyarázó fut (mérve mindkettővel ütközött), a térkép pedig
         a jobb felső sarkot foglalja — marad a bal felső és a középső sáv. */

      .fogo-me, .fogo-them { display: grid; grid-auto-flow: column; align-items: baseline; gap: 6px 10px; }
      .fogo b { font-size: 22px; color: #ffd9a8; letter-spacing: .02em; }
      .fogo span { font-size: 10px; letter-spacing: .12em; color: rgba(255,255,255,.55); }
      .fogo .kez[data-full="1"] { color: #ff7a29; }
      .fogo .bank[data-done="1"] { color: #6ef0c0; }
      .fogo-them b { color: #9d5cff; }
      .fogo-gun { display: flex; align-items: baseline; gap: 8px; }
      .fogo-gun b { font-size: 26px; }
      .fogo-gun b[data-state="empty"] { color: #ff4d3d; }
      .fogo-gun b[data-state="reload"] { color: #7ad7ff; }
      .fogo[hidden] { display: none; }

      .select .card .portrait {
        display: block; width: 100%; height: 150px; object-fit: cover;
        object-position: 50% 32%;
        border-radius: 4px;
        margin: -3px 0 1px;
        transition: transform 160ms ease, filter 160ms linear;
        filter: saturate(.92) brightness(.92);
      }
      .select .card.is-hovered .portrait { transform: scale(1.03); filter: none; }
      .select .card.is-locked .portrait { filter: none; }

      .select .card {
        display: flex; flex-direction: column; gap: 7px;
        padding: 13px 14px 12px; border-radius: 5px; text-align: left;
        background: rgba(255,255,255,.035);
        border: 1px solid rgba(255,255,255,.07);
        border-top: 3px solid var(--c);
        transition: background 140ms linear, border-color 140ms linear, transform 140ms ease;
      }
      .select .card.is-hovered { background: rgba(255,255,255,.08); transform: translateY(-3px); }
      .select .card.is-locked { border-color: var(--c); background: rgba(255,255,255,.11); }
      .select .card header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .select .card h3 { font-size: 13px; letter-spacing: .1em; color: var(--c); }
      .select .card .ability { font-size: 11.5px; line-height: 1.6; opacity: .82; }
      .select .who { display: flex; gap: 4px; min-height: 16px; }
      .select .chip {
        font-size: 9px; font-weight: 700; letter-spacing: .1em; padding: 2px 6px;
        border-radius: 2px; border: 1px solid currentColor; opacity: .55;
      }
      .select .chip.p1 { color: #ff7a29; }
      .select .chip.p2 { color: #9d5cff; }
      .select .chip.on { opacity: 1; background: currentColor; color: #0b0716; }
      .select .chip.p1.on { background: #ff7a29; }
      .select .chip.p2.on { background: #9d5cff; }

      .select dl { display: grid; gap: 4px; margin-top: 2px; }
      .select dl div { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .select dt { font-size: 9.5px; letter-spacing: .12em; opacity: .42; }
      .select dd { display: flex; gap: 3px; }
      .select dd i {
        width: 11px; height: 3px; border-radius: 1px; background: rgba(255,255,255,.13);
      }
      .select dd i.on { background: var(--c); }

      .select .roles {
        display: grid; gap: 12px; width: 100%; max-width: 680px;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
      .select .role {
        padding: 18px; border-radius: 5px; text-align: left;
        background: rgba(255,255,255,.035);
        border: 1px solid rgba(255,255,255,.07);
        border-left: 3px solid var(--c);
        transition: background 140ms linear;
      }
      .select .role.is-driver { background: rgba(255,255,255,.1); }
      .select .role .tag { font-size: 9.5px; letter-spacing: .14em; opacity: .5; }
      .select .role h3 {
        font-size: 17px; letter-spacing: .12em; color: var(--c); margin: 6px 0 8px;
      }
      .select .role p { font-size: 11.5px; line-height: 1.65; opacity: .62; }

      /* Onboarding text, not HUD: it retires so it can never fight a player's
         own panel once the screen splits. */
      #help {
        position: fixed; right: 14px; top: 14px; z-index: 5;
        animation: help-retire 1s ease-in 7s forwards;
        padding: 10px 14px; border-radius: 4px;
        background: rgba(10, 6, 22, .7); backdrop-filter: blur(6px);
        font-size: 11px; line-height: 1.7; opacity: .75;
      }
      #help:hover { animation: none; opacity: .75; }
      @keyframes help-retire { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #help { animation-duration: .01s; } }
      #help b { color: #ff7a29; }
      #help i { color: #9d5cff; font-style: normal; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <div id="help">
      <b>P1</b> — WASD · Space · Shift · <b>E</b><br />
      <i>P2</i> — nyilak · Enter · jobb Shift · <i>/</i><br />
      gamepad automatikusan átveszi<br />
      <span style="opacity:.5">SOFŐR: kormányoz · NAVIGÁTOR: CÉL / IRÁNY / RADAR</span><br />
      <span style="opacity:.5">R — szerepcsere &nbsp;·&nbsp; H — belépés a házba</span><br />
      <span style="opacity:.5"><b>Esc</b> — szünet és beállítások</span><br />
      <span style="opacity:.5">?mode=house &nbsp;·&nbsp; ?mode=arena</span>
    </div>
  </body>
</html>
